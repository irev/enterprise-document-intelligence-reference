name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy src/edi_reference

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test with default-suite coverage
        run: python -m pytest --cov=edi_reference --cov-report=term-missing


  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edi
          POSTGRES_PASSWORD: edi
          POSTGRES_DB: edi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edi -d edi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EDI_TEST_POSTGRES_DSN: postgresql://edi:edi@localhost:5432/edi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with PostgreSQL adapter
        run: python -m pip install -e ".[dev,postgres]"
      - name: Apply PostgreSQL migrations
        run: python scripts/apply_migrations.py --dsn "$EDI_TEST_POSTGRES_DSN"
      - name: PostgreSQL integration tests with coverage
        run: python -m pytest tests/integration -vv --cov=edi_reference --cov-report=term-missing
