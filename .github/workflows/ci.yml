name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest


  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edi
          POSTGRES_PASSWORD: edi
          POSTGRES_DB: edi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edi -d edi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EDI_TEST_POSTGRES_DSN: postgresql://edi:edi@localhost:5432/edi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with PostgreSQL adapter
        run: python -m pip install -e ".[dev,postgres]"
      - name: PostgreSQL integration tests
        run: python -m pytest tests/integration
