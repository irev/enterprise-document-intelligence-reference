schema_version = "1"

[policy]
core_requires_ml_runtime = false
allow_silent_provider_fallback = false
production_pin_model_revision = true
support_offline_artifacts = true

[providers.paddle-ocr]
capabilities = ["TEXT_EXTRACTION", "LAYOUT"]
runtime_family = "paddle"
required = false
profiles = ["cpu", "nvidia"]
models = ["pp-ocrv6-medium", "pp-ocrv5-server", "pp-structure-v3"]

[providers.qwen25-vl-7b]
capabilities = ["CLASSIFICATION", "FIELD_EXTRACTION"]
runtime_family = "pytorch-transformers"
required = false
profiles = ["cpu", "nvidia", "quantized"]
models = ["qwen25-vl-7b"]

[providers.qwen25-vl-3b]
capabilities = ["CLASSIFICATION", "FIELD_EXTRACTION"]
runtime_family = "pytorch-transformers"
required = false
profiles = ["cpu", "nvidia"]
models = ["qwen25-vl-3b"]

[providers.docling]
capabilities = ["TEXT_EXTRACTION", "LAYOUT"]
runtime_family = "docling"
required = false
profiles = ["cpu", "accelerator"]
models = []

[providers.surya]
capabilities = ["TEXT_EXTRACTION", "LAYOUT"]
runtime_family = "pytorch"
required = false
profiles = ["cpu", "nvidia", "mps"]
models = []
