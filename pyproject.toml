[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-document-intelligence-reference"
version = "0.1.0"
description = "Python reference implementation of the Enterprise Document Intelligence specification"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edi_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Import ordering predates the lint baseline and is intentionally deferred so
# the first blocking gate targets correctness signals without a repository-wide
# formatting-only rewrite.

[tool.mypy]
python_version = "3.12"
files = ["src/edi_reference"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
